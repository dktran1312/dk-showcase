[package]
name = "dk-meeting"
version = "0.1.0"
description = "DK Meeting — ghi âm, dịch & tóm tắt cuộc họp (DK TRAN)"
authors = ["DK TRAN"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dk_meeting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
whisper-rs = { version = "0.16", features = ["log_backend"] }
rubato = "0.16"
ureq = { version = "3", features = ["json", "platform-verifier"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[features]
default = []
# Build whisper.cpp với CUDA (card NVIDIA). Cần CUDA Toolkit 12.8+ (RTX 50xx) và CMake.
cuda = ["whisper-rs/cuda"]
# Dự phòng cho bản sau (AMD/Intel, macOS).
vulkan = []
metal = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
